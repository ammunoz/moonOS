# The terminal the Noctalia shell launches for applications that ask for
# one. Noctalia checks $TERMINAL first and only then falls back to
# x-terminal-emulator and a list of common emulators.
#
# This is the environment.d file, which is what covers the graphical
# session; /etc/profile.d/terminal.sh does the same for login shells.
TERMINAL=kitty

# The XDG data directories of a session that does not source the login
# profile do not include the system Flatpak exports, so the desktop files
# of the Flatpaks would be invisible to the launcher and to xdg-open. The
# Flatpak package's own profile script adds the user installation on top
# of this when the login profile does run.
XDG_DATA_DIRS=/usr/local/share:/usr/share:/var/lib/flatpak/exports/share
