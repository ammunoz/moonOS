# The Noctalia greeter runs as its own unprivileged account.
#
# On ostree systems a user created with `useradd` from a %post scriptlet would
# only end up in the writable /etc overlay, so the account is declared here and
# is recreated from /usr on every boot.
#
#Type Name    ID    GECOS               Home directory           Shell
u     greeter -     "Noctalia Greeter"  /var/lib/noctalia-greeter /usr/sbin/nologin
g     greeter -                                    -
m     greeter video
m     greeter input
m     greeter render
