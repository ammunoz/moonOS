# System-wide kitty configuration for moonOS.
#
# kitty reads the configuration files in the XDG configuration directories,
# so this file is picked up from /etc/xdg/kitty/kitty.conf. A user's own
# ~/.config/kitty/kitty.conf is read afterwards and overrides what is set
# here.

# The Nerd Font the fonts module installs. The "Mono" variant keeps the
# symbol glyphs at the same width as the text, which is what a terminal
# wants; yazi's icons need it too.
font_family      "JetBrainsMono Nerd Font Mono"
font_size        12.0

scrollback_lines 10000

copy_on_select    yes
url_color         #88C0D0

# Nord, the same palette the yazi configuration uses.
foreground       #D8DEE9
background       #2E3440
cursor           #D8DEE9
cursor_text_color #2E3440
selection_foreground #D8DEE9
selection_background #434C5E
cursor_shape     beam
cursor_blink_interval 0

# Show an image in the terminal: kitty's icat kitten opens a file chooser
# and renders the picture with the graphics protocol.
map ctrl+shift+i launch --type=overlay kitten icat
