---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/ammunoz/moonos-sway
name: moonos-sway
description: Personally official moonOS image.
base-image: quay.io/fedora/fedora-sway-atomic
image-version: latest

modules:
  - from-file: common.yml
  - type: dnf
    repos:
      copr:
        - swayfx/swayfx
    install:
      packages:
        - swayfx
  - from-file: final.yml
