---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to <registry>/<namespace>/<name>
name: moonos
# description will be included in the image's metadata
description: moonOS - Noctalia Shell on the Umbriel compositor, a custom Fedora Atomic desktop.

# the base image to build on top of (FROM) and the version tag to use.
# Fedora 44 is the current GA release; 45 is still frozen upstream.
base-image: ghcr.io/blue-build/base-images/fedora-base
image-version: 44

# module configuration, executed in order
modules:
  # Kernel modules. The akmods module type makes BlueBuild stage Universal
  # Blue's prebuilt module bundle for the kernel of our base image, and
  # "source: local" makes it run modules/akmods/akmods.sh instead of the
  # built-in script.
  #
  # This has to run before the dnf module. openrazer-daemon pulls in the
  # openrazer package, which needs something to provide openrazer-kmod.
  # Until the bundle is installed, the only provider is Terra's
  # akmod-openrazer, whose install script tries to compile the module and
  # fails as root. With the prebuilt module in place, dnf finds the
  # provider it needs and never pulls in the akmod package.
  - type: akmods
    source: local
    base: main

  - type: dnf
    repos:
      files:
        add:
          # Terra ships the Umbriel compositor and the Noctalia greeter. The
          # Noctalia shell itself is in Fedora too, and Fedora's build is the
          # newer one, so that is the one dnf picks. The file name carries the
          # Fedora release, so %OS_VERSION% has to match image-version.
          - terra-%OS_VERSION%.repo
          # Tailscale's own repository. It carries newer releases than
          # Fedora does, and skips itself when it cannot be reached.
          - tailscale.repo
          # Yazi, the file manager, from the unofficial COPR the yazi
          # documentation points at. Yazi is not packaged in Fedora.
          - yazi.repo
      keys:
        - https://repos.fyralabs.com/terra%OS_VERSION%/key.asc
        - https://pkgs.tailscale.com/stable/fedora/repo.gpg
        - https://download.copr.fedorainfracloud.org/results/lihaohong/yazi/pubkey.gpg
    install:
      packages:
        # terminal
        - kitty
        # the file manager, from the COPR added above
        - yazi
        # the tools yazi shells out to for its previews and its search. Most
        # of them come in as weak dependencies of yazi, but the image should
        # not depend on that.
        - resvg
        - fd-find
        - ripgrep
        - fzf
        - zoxide
        # previewers: PDF, fonts and HEIC/JXL images, video thumbnails.
        # Fedora has no ffmpeg package, only ffmpeg-free.
        - poppler-utils
        - ImageMagick
        - ffmpeg-free
        # desktop integration: the MIME database, the desktop database and
        # the default terminal for "open in a terminal"
        - shared-mime-info
        - desktop-file-utils
        - xdg-utils
        - xdg-terminal-exec
        # micro is the only editor on this image
        - micro
        - micro-default-editor
        # compositor, desktop shell and login screen
        - umbriel-nightly
        - noctalia
        - noctalia-greeter
        # desktop portals for the Umbriel session (screenshot, screen share)
        - xdg-desktop-portal-umbriel-nightly
        # login
        - greetd
        # first-boot wizard that creates the user account
        - initial-setup
        # session plumbing
        - polkit
        - systemd-pam
        - gnome-keyring
        - accountsservice
        # networking: iwd is picked automatically on Intel wireless cards
        - iwd
        - bluez
        # userland
        - git
        - git-credential-libsecret
        - stow
        - htop
        - distrobox
        - tailscale
        # FUSE 3 for AppImages. The base image already pulls this in
        # transitively, it is listed so that the image does not depend on that.
        - fuse3
        # daemon for the openrazer kernel module installed by the akmods module
        - openrazer-daemon
        # enrols the kernel module signing key in the MOK on SecureBoot systems
        - mokutil
        # desktop utilities the Noctalia shell does not provide
        # file-roller is the archive manager, 7zip gives it 7z support
        - file-roller
        - 7zip
        # mixer for per-application routing and device selection; the shell only
        # controls the master output and the microphone volume
        - pavucontrol
        # the shell's power-profile widget talks to org.freedesktop.UPower.
        # PowerProfiles, which this daemon provides
        - power-profiles-daemon
        # Passwords and Keys; the Secret Service provider the shell stores its
        # clipboard and calendar keys in. Not available as a Flatpak.
        - seahorse
        # DDC/CI brightness for external monitors. The shell recommends this
        # and uses it when [brightness] enable_ddcutil is turned on.
        - ddcutil
        # JSON processor
        - jq
    remove:
      packages:
        # the browser ships as a user flatpak instead
        - firefox
        - firefox-langpacks

        # micro is the only editor: drop nano, vi and the alternatives.
        # default-editor stays: micro-default-editor needs it, and it is
        # what provides the system-default-editor virtual provide.
        - nano
        - nano-default-editor
        - vim
        - vim-enhanced
        - vim-minimal
        - vim-common
        - vim-data
        - vim-filesystem
        - vim-default-editor

  - type: files
    files:
      - source: system
        destination: /

  - type: script
    snippets:
      # keep nano and rnano working, pointing at micro
      - ln -sf /usr/bin/micro /usr/bin/nano
      - ln -sf /usr/bin/micro /usr/bin/rnano
      # point greetd at the Noctalia greeter, running as its own account
      - sed -i -e 's|^command = .*|command = "/usr/bin/noctalia-greeter-session"|' -e 's|^user = .*|user = "greeter"|' /etc/greetd/config.toml
      # greetd needs a logind session for the greeter account; the shared
      # system-auth stack leaves pam_systemd disabled by default
      - grep -qE '^[[:space:]]*session[[:space:]]+required[[:space:]]+pam_systemd\.so' /etc/pam.d/greetd || printf 'session required pam_systemd.so\n' >> /etc/pam.d/greetd
      # the wifi backend detection script has to be executable
      - chmod 0755 /usr/libexec/moonos/select-wifi-backend
      # the MOK enrolment helper is run by systemd as root
      - chmod 0755 /usr/libexec/moonos/enroll-akmods-key
      # the desktop database has to know about the entries the files module
      # dropped in, or xdg-mime does not see them
      - update-desktop-database /usr/share/applications
      # and the MIME database has to know about the types the desktop
      # entries declare
      - update-mime-database /usr/share/mime

  - type: systemd
    system:
      enabled:
        - greetd.service
        - initial-setup.service
        - moonos-wifi-backend.service
        - moonos-greeter-setup.service
        - moonos-akmods-key.service
        - power-profiles-daemon.service

  # Fonts. The base image already ships the default font set, these two are
  # for the shell: JetBrains Mono is a Nerd Font and carries the symbol
  # glyphs, Inter is the family the shell suggests in its font setting.
  - type: fonts
    fonts:
      nerd-fonts:
        - JetBrainsMono
      google-fonts:
        - Inter

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        repo:
          title: Flathub (system)
        install: # system flatpaks we want all users to have and not remove
          - com.github.tchx84.Flatseal
          - org.gnome.Calculator
          - org.gnome.Evince
          - org.gnome.Loupe
          - org.gnome.Music
      - scope: user # user flatpaks, installed for each user on their first login
        repo:
          title: Flathub (user)
        install:
          - com.bitwarden.desktop
          - com.discordapp.Discord
          - com.heroicgameslauncher.hgl
          - com.obsproject.Studio
          - com.spotify.Client
          - com.valvesoftware.Steam
          - eu.betterbird.Betterbird
          - io.gitlab.librewolf-community
          - io.mpv.Mpv
          - org.kde.krita
          - org.libreoffice.LibreOffice
          - us.zoom.Zoom

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
