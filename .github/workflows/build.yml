name: bluebuild
on:
  schedule:
    - cron:
        "00 08 * * *" # build every day at 08:00 UTC
        # (a couple of hours after Universal Blue's daily images start
        # building, so their base image and akmods bundle have settled)
  push:
    branches:
      - main # only the release path; PR branches are covered by pull_request
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  lint:
    name: Validate Recipe
    runs-on: ubuntu-latest
    # the daily build does not need to re-validate the recipe
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install BlueBuild
        run: |
          sudo docker rm -f bluebuild-installer 2>/dev/null || true
          sudo docker create --name bluebuild-installer ghcr.io/blue-build/cli:v0.9-installer
          sudo docker cp bluebuild-installer:/out/bluebuild /usr/local/bin/bluebuild
          sudo docker rm bluebuild-installer

      # validates the recipe against the published JSON schema, including
      # any from-file: module references
      - name: Validate recipe
        run: bluebuild validate recipes/recipe.yml

  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    # a pull request from a fork gets no secrets, so there is no signing key
    # to sign it with
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # GitHub-hosted runners are killed after 6 hours; fail a hung build
    # earlier with a clear timeout
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
      # no id-token: write - the image is signed with the cosign key pair in
      # secrets.SIGNING_SECRET, so the keyless/OIDC path is never used
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml
    steps:
      # the kernel check reads the recipe and the helper script, so the
      # repository has to be in the workspace before the first step
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the kernel modules moonOS ships are prebuilt for one exact kernel.
      # If the base image has moved on, Universal Blue has not rebuilt the
      # bundle yet and the modules cannot be installed, so stop here rather
      # than publish an image that is missing them.
      - name: Check the kernel matches the akmods bundle
        run: python3 scripts/check-akmods-kernel.py

      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@c295af864f2802fc6aea227507af43d35823db81 # v1.13
        with:
          # the repository is already checked out above
          skip_checkout: true
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          # publish to the GitHub container registry; the image name comes
          # from the recipe, so this is ghcr.io/ammunoz/moonos
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # pin the CLI version, otherwise the action queries api.github.com
          # for the latest tag
          cli_version: v0.9

          # a GitHub-hosted runner starts with ~14 GB of free disk, which is
          # not enough for an image build
          maximize_build_space: true
